      <path d="M0 8H100M0 23H100M0 41H100M0 67H100M0 88H100" stroke="#fff" stroke-opacity="0.035"/>
      <path d="M17 0V100M48 0V100M83 0V100" stroke="#fff" stroke-opacity="0.018"/>
    </pattern>
  </defs>
