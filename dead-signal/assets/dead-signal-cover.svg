<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">DEAD SIGNAL cover concept</title>
  <desc id="desc">A dark luxury cruise ship stranded at night under a broken broadcast signal.</desc>
  <defs>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.45" stop-color="#06080d"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="23%" r="55%">
      <stop offset="0" stop-color="#43f3ff" stop-opacity="0.22"/>
      <stop offset="0.46" stop-color="#43f3ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="noise" width="100" height="100" patternUnits="userSpaceOnUse">
